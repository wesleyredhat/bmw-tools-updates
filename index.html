<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGU Novidades</title>
<meta name="description" content="Varredura do GitHub: novidades dos vendors do MGU Launcher e vendors novos para o MGU (iDrive 7) e NBT EVO.">
<meta name="theme-color" content="#16181c">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181c; --muted: #5d6470; --line: #e2e5ea;
    --green: #1a7f37; --green-bg: #dafbe1; --amber: #9a6700; --amber-bg: #fff4d4;
    --grey: #57606a; --grey-bg: #eaeef2; --red: #cf222e; --red-bg: #ffebe9; --accent: #0969da; --accent-bg: #ddf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --card: #1f2228; --text: #e8eaed; --muted: #9aa1ab; --line: #30343b;
      --green: #56d364; --green-bg: #0f2f1a; --amber: #f0c674; --amber-bg: #3d2e04;
      --grey: #b0b6be; --grey-bg: #30343b; --red: #ff7b72; --red-bg: #3d1416; --accent: #79c0ff; --accent-bg: #0c2d4a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --card: #1f2228; --text: #e8eaed; --muted: #9aa1ab; --line: #30343b;
    --green: #56d364; --green-bg: #0f2f1a; --amber: #f0c674; --amber-bg: #3d2e04;
    --grey: #b0b6be; --grey-bg: #30343b; --red: #ff7b72; --red-bg: #3d1416; --accent: #79c0ff; --accent-bg: #0c2d4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px;
          margin-bottom: 14px; position: sticky; top: 8px; z-index: 2; }
  .tabs button { flex: 1; font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); background: transparent;
                 border: 0; border-radius: 9px; padding: 9px 8px; cursor: pointer; }
  .tabs button.on { color: var(--text); background: var(--bg); }
  .tabs .n { font-size: 12px; font-weight: 800; color: var(--amber); margin-left: 4px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 5px 11px; border: 1px solid var(--line);
          background: var(--card); color: var(--text); white-space: nowrap; }
  button.chip { cursor: pointer; font-family: inherit; }
  button.chip.on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 12px; letter-spacing: 1px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .name { font-weight: 700; overflow-wrap: anywhere; }
  .name a { color: var(--text); text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .desc { font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }
  .pill { font-size: 11px; font-weight: 800; letter-spacing: .4px; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .p-green { color: var(--green); background: var(--green-bg); }
  .p-amber { color: var(--amber); background: var(--amber-bg); }
  .p-grey { color: var(--grey); background: var(--grey-bg); }
  .p-red { color: var(--red); background: var(--red-bg); }
  .p-blue { color: var(--accent); background: var(--accent-bg); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  ul.commits { margin: 8px 0 0; padding: 0; list-style: none; }
  ul.commits li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .v { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 4px 0; }
  .quote { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 6px;
           font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
  .gone .name { text-decoration: line-through; color: var(--red); }
  .declined { opacity: .6; }
  input[type=search] { width: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--card);
                       border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .quiet { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .hide { display: none; }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>MGU · Novidades</h1>
      <div class="sub" id="when">Carregando a varredura…</div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" class="on" data-tab="ours" role="tab">No Launcher<span class="n" id="n-ours"></span></button>
    <button type="button" data-tab="new" role="tab">Vendors novos<span class="n" id="n-new"></span></button>
  </nav>

  <section id="tab-ours"></section>
  <section id="tab-new" class="hide">
    <input type="search" id="q" placeholder="Buscar (nome, o que faz, README, licença)…" aria-label="Buscar">
    <div class="summary" id="filters"></div>
    <div id="list-new"></div>
  </section>

  <footer>Gerada pela varredura do bmw-tools (tools/mgu_survey.py) · só leitura do GitHub</footer>
</main>
<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const gh = r => "https://github.com/" + r;
const day = s => (s || "").slice(0, 10).split("-").reverse().join("/");
const LIC_OK = /^(MIT|GPL|LGPL|AGPL|MPL|Apache|BSD|Unlicense|ISC|0BSD|CC0)/i;
const NBT = /nbt|entrynav|entry ?evo|\bid[56]\b|idrive ?[56]\b|qnx|6wa|dkombi/i;
const kind = r => /NBT EVO/.test(r.status || "") || NBT.test(r.repo + " " + (r.desc || "")) ? "NBT EVO" : "MGU";
const lic = l => !l || l === "none" || l === "NOASSERTION"
  ? '<span class="pill p-amber">SEM LICENÇA</span>'
  : `<span class="pill ${LIC_OK.test(l) ? "p-green" : "p-amber"}">${esc(l)}</span>`;

function commitsList(list, open) {
  if (!list || !list.length) return "";
  const lis = list.map(m => `<li>${esc(m)}</li>`);
  if (lis.length <= open) return `<ul class="commits">${lis.join("")}</ul>`;
  return `<ul class="commits">${lis.slice(0, open).join("")}</ul>` +
    `<details><summary>mais ${lis.length - open}</summary><ul class="commits">${lis.slice(open).join("")}</ul></details>`;
}

function renderOurs(d) {
  const out = [];
  const moved = (d.vendors || []).filter(v => !v.gone && ((v.commits || []).length || (v.releases || []).length || v.archived));
  const gone = (d.vendors || []).filter(v => v.gone);
  const quiet = (d.vendors || []).filter(v => !v.gone && !moved.includes(v));
  const newReply = (d.issues || []).some(i => (i.new || []).some(c => c.by !== "wesleyredhat"));
  const behind = (d.vendored || []).filter(x => x.ahead > 0 && !x.auto);
  out.push(`<div class="summary">
    <span class="chip">${moved.length} com novidade</span>
    <span class="chip">${quiet.length} sem mudança</span>
    ${gone.length ? `<span class="chip" style="color:var(--red)">${gone.length} sumiu do GitHub</span>` : ""}
    ${behind.length ? `<span class="chip" style="color:var(--amber)">${behind.length} cópia(s) para atualizar</span>` : ""}
    <span class="chip" style="color:${newReply ? "var(--green)" : "var(--muted)"}">${newReply ? "issue com resposta nova" : "issues sem resposta nova"}</span>
  </div>`);

  // the issues we follow
  out.push(`<div class="card"><h2>Issues que acompanhamos</h2>` + (d.issues || []).map(i => {
    const others = (i.new || []).filter(c => c.by !== "wesleyredhat");
    const ours = (i.new || []).filter(c => c.by === "wesleyredhat");
    const pill = others.length ? '<span class="pill p-green">RESPOSTA NOVA</span>' : '<span class="pill p-grey">SEM RESPOSTA</span>';
    return `<div class="row"><div><div class="name"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.repo)} #${i.number}</a></div>
      <div class="meta">${esc(i.what)} · ${esc(i.state === "open" ? "aberta" : i.state)} · ${i.comments} comentário(s) · atualizada ${day(i.updated)}</div></div>${pill}</div>` +
      others.map(c => `<div class="quote"><b>${esc(c.by)}</b> · ${day(c.at)}\n${esc(c.body)}</div>`).join("") +
      (ours.length ? `<div class="meta" style="margin-top:6px">Nosso comentário de ${day(ours[ours.length - 1].at)} ainda é o último.</div>` : "");
  }).join("") + `</div>`);

  if (gone.length) {
    out.push(`<div class="card"><h2>Sumiu do GitHub (o Launcher falha nela)</h2>` + gone.map(v =>
      `<div class="gone"><div class="name">${esc(v.repo)}</div><div class="meta">${esc(v.note)} · o repositório responde 404</div></div>`).join("") + `</div>`);
  }

  if ((d.vendored || []).length) {
    out.push(`<div class="card"><h2>Cópias no projeto (vendor/)</h2>` + d.vendored.map(x => {
      const pill = x.ahead == null ? '<span class="pill p-grey">?</span>'
        : x.ahead === 0 ? '<span class="pill p-green">EM DIA</span>'
        : x.auto ? `<span class="pill p-blue">${x.ahead} NOVOS · O LAUNCHER BAIXA</span>`
        : `<span class="pill p-amber">${x.ahead} NOVOS · SYNC MANUAL</span>`;
      return `<div style="margin-top:8px"><div class="row"><div><div class="name"><a href="${esc(gh(x.repo))}" target="_blank" rel="noopener">${esc(x.repo)}</a></div>
        <div class="meta">vendor/${esc(x.dir)} · nossa cópia <span class="v">${esc((x.sha || "").slice(0, 7))}</span></div></div>${pill}</div>
        ${x.auto ? "" : commitsList(x.commits, 3)}</div>`;
    }).join("") + `</div>`);
  }

  out.push(`<div class="card"><h2>Vendors com novidade</h2>` + (moved.length ? moved.map(v => `
    <div style="margin-top:10px"><div class="row"><div>
      <div class="name"><a href="${esc(gh(v.repo))}" target="_blank" rel="noopener">${esc(v.repo)}</a></div>
      <div class="meta">${esc(v.note)} · push ${day(v.pushed)}${v.archived ? " · ARQUIVADO" : ""}</div></div>
      <span class="pill p-amber">${(v.commits || []).length} COMMIT(S)</span></div>
      ${(v.releases || []).length ? `<div class="pills">${v.releases.map(r => `<span class="pill p-blue">${esc(r)}</span>`).join("")}</div>` : ""}
      ${commitsList(v.commits, 3)}</div>`).join("") : '<div class="empty">Nenhum vendor mudou desde a última varredura.</div>') +
    `<div class="meta" style="margin-top:10px">Apps e versões novas desses vendors aparecem sozinhas no Launcher (ele lê os vendors ao vivo).</div></div>`);

  if (quiet.length) {
    out.push(`<div class="card"><h2>Sem mudança</h2><div class="quiet">${quiet.map(v => esc(v.repo)).join(" · ")}</div></div>`);
  }

  const others = d.owners_new || [];
  out.push(`<div class="card"><h2>Outros repositórios dos nossos vendors</h2>` + (others.length ? others.map(row).join("") :
    '<div class="empty">Nenhum.</div>') + `<div class="meta" style="margin-top:8px">Esses o Launcher NÃO pega sozinho.</div></div>`);
  document.getElementById("tab-ours").innerHTML = out.join("");
  document.getElementById("n-ours").textContent = moved.length ? moved.length : "";
}

// our verdict on a repo (tools/survey-notes.json): the pill's colour
const STATUS = s => /candidat/i.test(s) ? "p-green" : /recus|risco/i.test(s) ? "p-red" : /segur|observ|aguard/i.test(s) ? "p-amber"
  : /já temos|ja temos|não é|nao e|fora/i.test(s) ? "p-grey" : "p-blue";

function row(r) {
  const pills = [r.new ? '<span class="pill p-amber">NOVO</span>' : '<span class="pill p-grey">ATUALIZADO</span>',
                 lic(r.licence), `<span class="pill p-grey">★ ${r.stars}</span>`, `<span class="pill p-blue">${kind(r)}</span>`];
  if (r.status) pills.unshift(`<span class="pill ${STATUS(r.status)}">${esc(r.status.toUpperCase())}</span>`);
  if (r.declined) pills.push(`<span class="pill p-red">RECUSADO: ${esc(r.declined)}</span>`);
  // what it really is: our Portuguese summary first; else the README's own words; the GitHub one-liner last
  const what = r.pt ? `<div class="desc">${esc(r.pt)}</div>`
    : r.readme ? `<div class="desc">${esc(r.readme.split("\n").filter(x => x.trim()).slice(0, 3).join(" · ").slice(0, 360))}…</div>`
    : `<div class="desc">${esc(r.desc || "(sem descrição nem README)")}</div>`;
  const line = r.desc && (r.pt || r.readme) ? `<div class="meta" style="margin-top:4px">GitHub: ${esc(r.desc)}</div>` : "";
  const comps = (r.components || []).length ? `<div class="meta" style="margin-top:4px">No MGU Store: ${r.components.map(c =>
    `<span class="v">${esc(c.id)}</span>${c.kind === "app" ? "" : " (" + esc(c.kind) + ")"}`).join(", ")}</div>` : "";
  const readme = r.readme ? `<details><summary>README original</summary><div class="quote">${esc(r.readme)}</div></details>` : "";
  return `<div class="${r.declined ? "declined" : ""}" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
    <div class="name"><a href="${esc(gh(r.repo))}" target="_blank" rel="noopener">${esc(r.repo)}</a></div>
    ${what}${line}${comps}
    <div class="pills">${pills.join("")}</div>
    ${readme}
    <div class="meta" style="margin-top:6px">criado ${day(r.created)} · push ${day(r.pushed)}</div></div>`;
}

const F = {novo: false, mgu: false, nbt: false, lic: false};
function renderNew(d) {
  const all = (d.wide || []);
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = all.filter(r => (!F.novo || r.new) && (!F.mgu || kind(r) === "MGU") && (!F.nbt || kind(r) === "NBT EVO") &&
    (!F.lic || LIC_OK.test(r.licence || "")) &&
    (!q || [r.repo, r.desc, r.licence, r.pt, r.status, r.readme].join(" ").toLowerCase().includes(q)));
  const chip = (k, label, n) => `<button type="button" class="chip ${F[k] ? "on" : ""}" data-f="${k}">${label} (${n})</button>`;
  document.getElementById("filters").innerHTML =
    chip("novo", "Só novos", all.filter(r => r.new).length) + chip("mgu", "MGU", all.filter(r => kind(r) === "MGU").length) +
    chip("nbt", "NBT EVO", all.filter(r => kind(r) === "NBT EVO").length) +
    chip("lic", "Licença livre", all.filter(r => LIC_OK.test(r.licence || "")).length);
  document.getElementById("list-new").innerHTML = `<div class="card"><h2>${list.length} de ${all.length} repositórios fora do Launcher</h2>` +
    (list.length ? list.map(row).join("") : '<div class="empty">Nada com esses filtros.</div>') +
    `<div class="meta" style="margin-top:10px">Antes de entrar no Launcher cada um tem o código lido (escritas no carro, patches, rede) e só entra com o seu OK.</div></div>`;
  document.getElementById("n-new").textContent = all.filter(r => r.new && !r.declined).length || "";
}

let DATA = null;
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.getElementById("tab-ours").classList.toggle("hide", b.dataset.tab !== "ours");
  document.getElementById("tab-new").classList.toggle("hide", b.dataset.tab !== "new");
  try { localStorage.setItem("mgu-tab", b.dataset.tab); } catch (e) {}
}));
document.getElementById("filters").addEventListener("click", e => {
  const k = e.target.closest("[data-f]");
  if (!k) return;
  F[k.dataset.f] = !F[k.dataset.f];
  if (k.dataset.f === "mgu" && F.mgu) F.nbt = false;
  if (k.dataset.f === "nbt" && F.nbt) F.mgu = false;
  renderNew(DATA);
});
document.getElementById("q").addEventListener("input", () => renderNew(DATA));

fetch("survey.json?t=" + Date.now()).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(d => {
  DATA = d;
  document.getElementById("when").textContent = `Varredura de ${day(d.made)} ${(d.made || "").slice(11, 16)} · novidades desde ${day(d.since)}`;
  renderOurs(d);
  renderNew(d);
  try { const t = localStorage.getItem("mgu-tab"); if (t) document.querySelector(`.tabs [data-tab="${t}"]`).click(); } catch (e) {}
}).catch(err => {
  document.getElementById("when").textContent = "Não consegui ler a varredura (" + err.message + ").";
});
</script>
</body>
</html>
